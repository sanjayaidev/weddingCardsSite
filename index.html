<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading invitation…</title>

  <!-- Google Fonts (loaded once, used by all templates) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@300;500;700&family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

  <!-- BASE CSS (always loaded) -->
  <link rel="stylesheet" href="css/base.css" />

  <!-- TEMPLATE CSS (injected dynamically by JS) -->
  <link id="template-css" rel="stylesheet" href="" />
</head>
<body>

  <!-- GATE SCREEN -->
  <section id="gate-screen" class="gate">
    <div class="gate-inner">
      <img id="gate-image" class="gate-image" src="" alt="" />
      <button id="gate-btn" class="gate-btn">Open the invitation</button>
    </div>
  </section>

  <!-- MAIN INVITATION -->
  <main id="invitation" class="invitation hidden">

    <!-- HERO -->
    <section id="hero-section" class="section hero-section">
      <div class="hero-content">
        <p class="tagline" id="hero-tagline"></p>
        <h1 class="names">
          <span id="hero-name1"></span>
          <span class="amp">&</span>
          <span id="hero-name2"></span>
        </h1>
        <p class="invite" id="hero-invite"></p>
        <div class="dates" id="hero-dates"></div>
        <div class="countdown" id="hero-countdown"></div>
        <p class="scroll-hint" id="hero-scroll"></p>
      </div>
      <div class="hero-image-wrap">
        <img id="hero-image" class="hero-image" src="" alt="" />
      </div>
    </section>

    <!-- STORY -->
    <section id="story-section" class="section story-section">
      <div class="story-inner">
        <h2 class="story-heading" id="story-heading"></h2>
        <blockquote class="story-quote" id="story-quote"></blockquote>
        <p class="story-by" id="story-by"></p>
      </div>
    </section>

    <!-- GALLERY -->
    <section id="gallery-section" class="section gallery-section">
      <p class="section-label" id="gallery-label"></p>
      <h2 class="section-heading" id="gallery-heading"></h2>
      <div id="gallery-grid" class="gallery-grid"></div>
    </section>

    <!-- FAMILIES -->
    <section id="families-section" class="section families-section">
      <p class="section-label" id="families-label"></p>
      <h2 class="section-heading" id="families-heading"></h2>
      <div id="families-grid" class="families-grid"></div>
    </section>

    <!-- EVENTS -->
    <section id="events-section" class="section events-section">
      <p class="section-label" id="events-label"></p>
      <h2 class="section-heading" id="events-heading"></h2>
      <div id="events-container" class="events-container"></div>
    </section>

    <!-- BANNER -->
    <section id="banner-section" class="section banner-section">
      <img id="banner-image" class="banner-image" src="" alt="" />
      <blockquote class="banner-quote" id="banner-quote"></blockquote>
    </section>

    <!-- VENUE -->
    <section id="venue-section" class="section venue-section">
      <p class="section-label" id="venue-label"></p>
      <h2 class="section-heading" id="venue-heading"></h2>
      <div class="venue-content">
        <img id="venue-image" class="venue-image" src="" alt="" />
        <div class="venue-info">
          <h3 id="venue-name"></h3>
          <p id="venue-address"></p>
          <a id="venue-maps" class="venue-maps-btn" href="#" target="_blank"></a>
        </div>
      </div>
    </section>

    <!-- RSVP -->
    <section id="rsvp-section" class="section rsvp-section">
      <p class="section-label" id="rsvp-label"></p>
      <h2 class="section-heading" id="rsvp-heading"></h2>
      <p class="rsvp-intro" id="rsvp-intro"></p>
      <form id="rsvp-form" class="rsvp-form">
        <input type="text" id="rsvp-name" placeholder="Your name" required />
        <select id="rsvp-from" required></select>
        <select id="rsvp-events" required></select>
        <select id="rsvp-guests" required></select>
        <button type="submit" id="rsvp-button"></button>
      </form>
      <div id="rsvp-thanks" class="rsvp-thanks hidden">
        <p id="rsvp-thanks-msg"></p>
        <p id="rsvp-thanks-by"></p>
      </div>
    </section>

    <!-- FOOTER -->
    <footer id="footer-section" class="section footer-section">
      <p class="footer-names" id="footer-names"></p>
      <p class="footer-blessing" id="footer-blessing"></p>
      <div class="footer-parents">
        <div class="footer-col" id="footer-left"></div>
        <div class="footer-col" id="footer-right"></div>
      </div>
      <pre class="footer-regards" id="footer-regards"></pre>
    </footer>

  </main>

  <!-- BACKGROUND MUSIC -->
  <audio id="bg-music" loop></audio>

  <!-- PETALS CANVAS -->
  <canvas id="petals-canvas"></canvas>

  <!-- SCRIPTS -->
  <script src="js/templates.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
